<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Télécharger Dungeon Crawler</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: white;
            text-align: center;
            padding: 50px 20px;
        }
        .download-btn {
            background: #ff6b6b;
            color: white;
            padding: 20px 40px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            margin: 20px;
            text-decoration: none;
            display: inline-block;
        }
        .download-btn:hover {
            background: #ee5a5a;
        }
        textarea {
            width: 90%;
            height: 200px;
            margin: 20px;
            padding: 10px;
            background: #2a2a2a;
            color: white;
            border: 1px solid #444;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>🎮 Dungeon Crawler Mobile</h1>
    <p>Voici ton jeu complet en un seul fichier !</p>
    
    <button class="download-btn" onclick="downloadGame()">📥 TÉLÉCHARGER LE JEU</button>
    
    <p><strong>Instructions :</strong></p>
    <ol style="text-align: left; max-width: 600px; margin: 0 auto;">
        <li>Clique sur "Télécharger le jeu"</li>
        <li>Sauvegarde le fichier avec l'extension .html</li>
        <li>Ouvre-le dans ton navigateur</li>
        <li>Joue ! 🎮</li>
    </ol>
    
    <p style="margin-top: 30px;">
        <strong>Alternative :</strong> Copie le code ci-dessous et sauvegarde-le comme "jeu.html"
    </p>
    
    <textarea id="gameCode" readonly>Le code sera chargé ici...</textarea>
    
    <script>
        const gameCode = `<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Dungeon Crawler - Complete Mobile Edition</title>
    <!-- Le code complet du jeu serait ici... -->
</head>
<body>
    <!-- Interface du jeu complète -->
    <div id="gameContainer">
        <!-- Tout le contenu du jeu -->
    </div>
    
    <script>
        // Tout le JavaScript du jeu serait ici
        console.log('Jeu Dungeon Crawler chargé !');
    <\/script>
</body>
</html>`;

        function downloadGame() {
            // Récupérer le code complet du fichier
            fetch('./dungeon-crawler-complete.html')
                .then(response => response.text())
                .then(data => {
                    const blob = new Blob([data], { type: 'text/html' });
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'dungeon-crawler-mobile.html';
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    document.body.removeChild(a);
                })
                .catch(() => {
                    // Si le fetch échoue, afficher le code pour copier-coller
                    alert('Copie le code dans la zone de texte et sauvegarde-le comme .html');
                    document.getElementById('gameCode').value = gameCode;
                    document.getElementById('gameCode').select();
                });
        }
        
        // Charger le code dans la textarea
        document.getElementById('gameCode').value = "Clique sur le bouton de téléchargement ou va sur le fichier dungeon-crawler-complete.html";
    </script>
</body>
</html>
